<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Community</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js"></script>
</head>

<body>
  <header>
    <div class="logo">Starry<span>Telling</span></div>
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search headlines...">
    </div>
    <nav class="navigation">
      <a href="#" id="homeBtn">Home</a>
      <a href="#" id="profileBtn">Profile</a>
      <button class="btnLogin-popup" id="authBtn">Login</button>
    </nav>
  </header>

  <!-- Feed -->
  <section class="feed">
    <div class="feed-container" id="feedContainer"></div>
  </section>

  <!-- Floating Post Button -->
  <button class="floating-btn" id="openPostBox">
    <i class="fas fa-plus"></i>
  </button>

  <!-- Floating Post Box -->
  <div class="floating-post" id="postBox">
    <textarea id="postContent" placeholder="What's on your mind?"></textarea>
    <input type="file" id="postImages" accept="image/*" multiple>
    <button class="btn" id="submitPost">Post</button>
  </div>

  <!-- Popup Wrapper (Login/Register) -->
  <div class="wrapper">
    <span class="icon-close"><ion-icon name="close"></ion-icon></span>

    <!-- Login Form -->
    <div class="form-box login">
      <h2>Login</h2>
      <form id="loginForm">
        <div class="input-box">
          <span class="icon"><ion-icon name="mail"></ion-icon></span>
          <input type="email" id="loginEmail" required>
          <label>Email</label>
        </div>
        <div class="input-box">
          <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
          <input type="password" id="loginPassword" required>
          <label>Password</label>
        </div>
        <button type="submit" id="loginBtn" class="btn">Login</button>
        <div class="login-register">
          <p>Don't have account? <a href="#" class="register-link">Register</a></p>
        </div>
      </form>
    </div>

    <!-- Register Form -->
    <div class="form-box register">
      <h2>Registration</h2>
      <form id="registerForm">
        <div class="input-box">
          <span class="icon"><ion-icon name="person"></ion-icon></span>
          <input type="text" id="registerUsername" required>
          <label>Username</label>
        </div>
        <div class="input-box">
          <span class="icon"><ion-icon name="mail"></ion-icon></span>
          <input type="email" id="registerEmail" required>
          <label>Email</label>
        </div>
        <div class="input-box">
          <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
          <input type="password" id="registerPassword" required>
          <label>Password</label>
        </div>
        <button type="submit" class="btn" id="registerBtn">Register</button>
        <div class="login-register">
          <p>Already have account? <a href="#" class="login-link">Login</a></p>
        </div>
      </form>
    </div>
  </div>

  <!-- Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword,
      createUserWithEmailAndPassword, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, query, orderBy, onSnapshot,
      serverTimestamp, doc, getDoc, setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBg0I0H6ID5piA15Fx1fmTRAP2SBlBBfDY",
      authDomain: "starrytelling2.firebaseapp.com",
      projectId: "starrytelling2",
      storageBucket: "starrytelling2.appspot.com",
      messagingSenderId: "519457333599",
      appId: "1:519457333599:web:cc7cc9cc27bcc2fdaf16ea"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Elements
    const wrapper = document.querySelector('.wrapper');
    const registerLink = document.querySelector('.register-link');
    const loginLink = document.querySelector('.login-link');
    const closeIcon = document.querySelector('.icon-close');
    const authBtn = document.getElementById("authBtn");
    const profileBtn = document.getElementById("profileBtn");
    const feedContainer = document.getElementById("feedContainer");
    const openPostBox = document.getElementById("openPostBox");
    const postBox = document.getElementById("postBox");
    const submitPost = document.getElementById("submitPost");

    // Popup
    document.querySelector('.btnLogin-popup').addEventListener('click', e => {
      e.preventDefault();
      wrapper.classList.remove('active');
      wrapper.style.display = 'flex';
    });
    registerLink.addEventListener('click', e => { e.preventDefault(); wrapper.classList.add('active'); });
    loginLink.addEventListener('click', e => { e.preventDefault(); wrapper.classList.remove('active'); });
    closeIcon.addEventListener('click', () => wrapper.style.display = 'none');

    // Profile
    homeBtn.addEventListener("click", e => {
      e.preventDefault();
      onAuthStateChanged(auth, user => {
        if(user) window.location.href = "index.html";
        else { alert("Please login first!"); wrapper.style.display = 'flex'; }
      });
    });

    // Auth State
    onAuthStateChanged(auth, user => {
      if(user){
        authBtn.textContent = "Logout";
        authBtn.onclick = async () => await signOut(auth);
        openPostBox.style.display = "flex";
      } else {
        authBtn.textContent = "Login";
        authBtn.onclick = e => { e.preventDefault(); wrapper.classList.remove('active'); wrapper.style.display = 'flex'; };
        openPostBox.style.display = "none"; postBox.style.display = "none";
      }
    });

  </script>
</body>
</html>
